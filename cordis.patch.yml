# 随包分发的 patch —— 由 package.json 的 dsh.bundle.patch 引用。
#
# 一行即可：本插件的 host 半（lib/index.js）与 client 半（lib/client.js，由
# exports["./client"] 与 dsh.client 声明）都由这一个 row 承载。
#
# 本插件不禁用、不覆盖任何官方行：
#   · 模型发现走 llm 服务的 registerModelDiscovery —— 该注册表每个 settings
#     命名空间只允许一个注册，而 @deepseek-ai/dsh-llm-deepseek 从未注册过
#     （0.1.2-rc.1 与 0.1.5-rc.2 实测 discover 均零命中），槽是空的。
#   · 余额走 webServer 服务自建路由 /api/dsh-llm-hub/balance，与官方路由不冲突。
#   · UI 走官方为「本仓库之外分发的插件」预留的 settings.models.provider-card。

- insert:
    - id: dsh-llm-hub
      name: '@dsh-plugins/dsh-llm-hub'

    # ── harness 子代理工具行 ───────────────────────────────────────────────────
    #
    # 三个外部 harness CLI（codex / claude / agy）的委派工具。provider 由 host 半
    # 的 `lib/harness.js` 按「本机装没装」注册。
    #
    # **没装的机器上这几行是惰性的**：`dsh-tool-subagent` 对缺失的 provider 只打一条
    # info（`provider "codex" not registered yet; the "subagent_codex" tool will
    # register when it appears`），工具行延迟到 provider 出现才注册。所以别人机器上
    # 没装 codex，`subagent_codex` 就不会出现在工具目录里，宿主也不会启动失败。
    #
    # `maxDepth: provider-managed`：子进程是另一个 harness 的完整运行时，父侧的深度
    # 计数管不到它，交给它自己管。
    #
    # ⚠️ 与 agent preset 里手工加的行冲突：同一个 toolName 不能注册两次。如果你在
    # `~/.dsh/.agent-presets/*/agent.cordis.yml` 里自己加过 `tool-subagent-codex`
    # 这类行，删掉那几行，改由本插件统一提供 —— 否则重名。
    - id: dsh-llm-hub-tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: dsh-llm-hub-tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: dsh-llm-hub-tool-subagent-antigravity
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: antigravity
        toolName: subagent_antigravity
        backgroundMode: one-shot
        maxDepth: provider-managed

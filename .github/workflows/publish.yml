name: Publish

# 推 `v*` tag 时自动发 npm；也能手动补发/重试（workflow_dispatch 填 tag）。
#
# 与 ci.yml 的关系：CI 每次 push 都跑校验，这里在发布前**再跑一遍**同样三件套 ——
# 发布是最后一道门，不依赖「之前某次 CI 应该跑过了」这种假设。
#
# 手动补发为什么必要：2026-09-16 实测，tag 已经推上去了、npm 因为账号侧原因没发成，
# 于是「git/Release 有、npm 没有」。没有 workflow_dispatch 就只能重推 tag（会撞
# 「tag 已存在」）或本地补发（依赖本机 token，正是这一环最容易出问题的地方）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.6.2）—— 补发或重试用'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm Trusted Publishing via GitHub OIDC
    env:
      # push 事件没有 inputs，取 github.ref_name（= tag 名）；手动触发时用填的那个。
      # 手动触发时用填的 tag；push 事件没有 inputs，`||` 回退到 tag 名。
      # 用 github.event.inputs 而不是 inputs：前者在非 dispatch 事件下是「没有这个键」
      # （表达式取 null，走回退），后者的可用性依赖较新的 GitHub 版本。
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # fetch-depth: 0 + fetch-tags —— 本工作流用 tag 的**注解**当 Release 标题
      # （`git tag -a ... -m "v0.6.2 — …"`）。浅克隆里 `%(contents:subject)` 取不到注解，
      # 标题会静默退化成裸 tag 名（不会报错，只是变难看）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure OIDC-capable npm
        run: npm install --global 'npm@^11.5.1'

      # 刻意**没有** `npm ci`：本包运行时与开发时都零依赖，也没有 lockfile
      # （ci.yml 里有同样的说明）。这里的三个检查只用 Node 内建能力。
      # 从别的仓库照抄带 `npm ci` 的版本会直接挂 —— bloom-theme 的 publish.yml 上
      # 就留着一句注释记录过这类事故（反方向：它确实有 devDependency，漏了 install
      # 于是 `sh: 1: contrast-guard: not found`、tag 打出去了 npm 没发成）。
      # 结论：发布工作流的安装步骤要按**本仓库**的依赖事实写，不能互抄。

      - name: 语法 + 回归测试
        run: |
          npm run check
          # `--if-present`：这个工作流也用来**补发旧 tag**（workflow_dispatch），而
          # v0.6.2 之前的 tag 树里还没有 `test` 脚本，严格 `npm test` 会让「补发一个
          # 老版本」在第一步就失败（实测：v0.6.1 报 Missing script: test）。
          # 0.6.2 起每个 tag 都带测试，所以正常发版路径上这道闸门依然是实的。
          npm test --if-present

      # tag 名必须与 package.json version 一致，防止「tag 是 v0.6.2、发的却是 0.6.1」；
      # 同时探测该版本是否已在 npm 上 —— 重推同一 tag / 重复点手动发布时不报错、不重发。
      #
      # 🔴 这一步必须排在发版门禁**之前**：门禁里的「运行期载荷比对」只在
      # 「马上要发一个新版本」这个前提下才有意义。对一个**已经发布过**的版本，
      # 它必然判定「与上一版载荷相同」而拒绝 —— 于是会把下面那条被刻意保护的场景
      # 一起拦死：「npm 已发成功、GitHub Release 却没建起来，需要补建」。
      # 2026-09-26 我第一版就犯了这个错：门禁挂在 ver 之前，v1.5.3 补建 Release
      # 会在门禁步直接 exit 1（实测复现过），而那时根本不需要发 npm。
      - name: 校验 tag 与版本一致，并探测 npm
        id: ver
        run: |
          TAG="${RELEASE_TAG#v}"
          VER="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG 与 package.json version $VER 不一致"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          # 必须带 scope：npm 上还留着一个同名无 scope 的旧包（dsh-llm-hub@0.6.1），
          # 探它等于探错包 —— 本包每个新版都「不存在」，于是重跑 workflow 会再发一次
          # 并撞 npm 的 403「cannot publish over previously published versions」，
          # 把已经成功的一次发布报成失败。2026-09-17 发 0.7.0 前发现。
          if npm view "@dsh-plugins/dsh-llm-hub@$VER" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v$VER 已在 npm 上，跳过 publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 发版门禁只有一处真源：scripts/prepublish-gate.mjs（本地 `prepublishOnly` 跑的就是它）。
      # 这里**调用同一个脚本**，而不是在 YAML 里再抄一份文件清单。
      #
      # 为什么这点很重要（2026-09-26）：本步骤原先硬编码了自己的 `need` 数组。
      # 1.5.0 推上去时 tarball 漏了 `assets/`（package.json#files 忘加），而那个数组里
      # **根本没写 assets** —— 于是 CI 一路绿、页面上却少三张截图。门禁与真源分叉之后，
      # 它拦的就不再是「约定」，而是「抄这份清单的人当时想到了什么」。
      #
      # 只在真要发版时跑（published == 'false'）：结论「与上一版载荷相同」只在
      # 「准备发一个新版本」的前提下才构成拒绝理由，对已发布版本是伪命题。
      # 与本地 prepublishOnly 重复一次是刻意的 —— 让它作为具名步骤出现在日志里，
      # 且万一有人把 prepublishOnly 从 package.json 摘掉，CI 这一侧仍然拦得住。
      #
      # `[ -f ]` 保护：本工作流要能补发旧 tag，而老 tag 树里还没有这个脚本。
      # 缺了就退回基础清单校验 —— 补发旧版本不该因为「当年还没有门禁」而失败。
      - name: 发版门禁（与本地 prepublishOnly 同源）
        if: steps.ver.outputs.published == 'false'
        run: |
          if [ -f scripts/prepublish-gate.mjs ]; then
            node scripts/prepublish-gate.mjs
          else
            echo "::warning::本 tag 树里没有 scripts/prepublish-gate.mjs（旧 tag），退回基础产物校验"
            npm pack --dry-run --json > pack.json
            node -e "
              const f = require('./pack.json')[0].files.map(x => x.path)
              const need = ['package.json', 'cordis.patch.yml', 'lib/client.js', 'lib/index.js', 'lib/harness.js', 'README.md', 'LICENSE']
              const miss = need.filter(n => !f.includes(n))
              if (miss.length) { console.error('发布产物缺少: ' + miss.join(', ')); process.exit(1) }
              console.log('发布产物完整 (' + f.length + ' 个文件)')
            "
          fi

      # npm 根据 GitHub OIDC 身份签发短期发布凭据；不再依赖仓库级 NPM_TOKEN。
      - name: npm publish
        if: steps.ver.outputs.published == 'false'
        run: npm publish --access public

      # 本仓库的 Release 是手建的（没有 release-please），所以这里负责建；但必须幂等：
      # `gh release view` 探到就跳过。bloom-theme 那边踩过的坑是两边都建，
      # 后建的撞 `HTTP 422 Release.tag_name already exists` 把整个 Publish 标红，
      # 而其实 npm 已经发成功了 ——「已经存在」是正常情况，不该算失败。
      #
      # 这一步**不挂** `published == 'false'`：npm 发没发过，与 Release 建没建成是两件
      # 独立的事。挂上去会让「npm 已发成功、Release 却没建起来」的重试场景失效
      # （published=true → 补建被整个跳过 → Release 永远补不上）。
      - name: GitHub Release（缺失时补建，正文取 CHANGELOG 对应小节）
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG 已存在，跳过"
            exit 0
          fi
          VER="${RELEASE_TAG#v}"
          # 标题承袭手工发布时的写法：`v0.6.2 — 一句话`，那句话就在 tag 注解里。
          SUBJECT="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$RELEASE_TAG")"
          TITLE="${SUBJECT:-$RELEASE_TAG}"
          # 正文取 CHANGELOG 里该版本的小节（到下一个 `## [` 之前）。
          node -e "
            const fs = require('fs')
            const ver = process.env.RELEASE_TAG.replace(/^v/, '')
            const text = fs.readFileSync('CHANGELOG.md', 'utf8')
            const start = text.indexOf('## [' + ver + ']')
            if (start < 0) { console.error('CHANGELOG 里找不到 ' + ver + ' 小节'); process.exit(1) }
            const rest = text.slice(start)
            const next = rest.indexOf('\n## [', 1)
            fs.writeFileSync('/tmp/notes.md', (next < 0 ? rest : rest.slice(0, next)).trim() + '\n')
            console.log('notes 取到 ' + (next < 0 ? rest : rest.slice(0, next)).length + ' 字符')
          "
          gh release create "$RELEASE_TAG" --title "$TITLE" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}

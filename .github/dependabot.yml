# Dependabot —— 依赖漏洞与版本更新。
#
# 为什么要装这个（2026-10-30 补记）：
#   这个仓库此前没有 dependabot 配置，等于**依赖漏洞和上游破坏性变更
#   不会主动通知任何人**。上面那个 CI 注释就是活例子 —— 接入
#   @deepseek-ai/schemastery 时漏了「安装 devDependencies」这一步，
#   CI 会在回归测试那步红在 ERR_MODULE_NOT_FOUND，而不是红在真正的断言上。
#   依赖更新必须能被「推着走」，而不是靠谁想起来去看。
#
# 为什么分成两个 ecosystem：
#   npm —— 运行时/开发依赖（含 schemastery 这个 settings 适配的关键依赖）。
#   github-actions —— CI 里的 action 各自有发版节奏，actions/checkout 与
#   actions/setup-node 的版本漂移会直接影响 CI 能不能跑起来。
#
# 注意锁文件：本仓库用 npm（CI 跑 npm ci），lockfile 名为 package-lock.json。

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # 同类依赖合一个 PR：schemastery 的小版本与其它 devDependency 一起升级，
      # 拆开反而不好 review。
      dev-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
